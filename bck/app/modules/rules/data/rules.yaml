schema_version: 1
# The published identity of this rule set. Copied by value onto every finding, so a
# verdict issued today still names the set that produced it after the store is amended.
# Bump on any change to the rules below; never reissue a version that has been used.
rule_set_version: '2026.09.2'
rules:
  # Rule 3 comes first because it is prior to everything below it: it says which packages
  # Chapter II reaches at all. Every other rule in this store states an obligation inside
  # that chapter, so a package Rule 3 excludes owes none of them and the correct field
  # state is NOT_APPLICABLE. That is not Rule 26, which exempts a package still inside the
  # chapter, and not a sector override, which moves one obligation while the rest stay.
  #
  # THREE LIMBS, TWO OF WHICH ARE ENCODED AS DECIDING ANYTHING.
  # 3(a) is deterministic from the declared net quantity. 3(b) is subsumed by 3(a) — every
  # package it names is in bags above 50 kg and therefore already beyond 3(a)'s 25 kg — so
  # its parameters are recorded here for completeness and for the guard that watches the
  # relationship, and no branch consults them. See rules.scope.rule_3b_is_subsumed_by_rule_3a.
  # 3(c) has one observable limb, the 'not for retail sale' marker, which routes to an
  # officer and never decides on its own.
  #
  # SOURCE PROVENANCE, STATED NOT LAUNDERED.
  # not_for_retail_sale_marker is the phrase required by clauses 2(bb) and 2(bc) *as
  # substituted*, not by Rule 3. The compilation prints the substitution as "(i) for
  # clauses (bb) and (bc), the following clauses shall be substituted, namely" and DOES
  # NOT NAME THE NOTIFICATION that made it. This compilation is semi-official. The clause
  # text is verbatim from the cited PDF; the instrument behind it is not in the corpus.
  #
  # The Rules name no institutions. Hotels, hospitals, airlines and railways are canonical
  # in secondary commentary and appear nowhere in this corpus — do not list them here.
  #
  # effective_from is Rule 3's own commencement, 01.04.2011. The marker phrase derives from
  # the substituted 2(bb)/2(bc), effective 01.04.2022; dating the whole rule to 2022 would
  # silently disable limb 3(a), law since 2011, for a scan dated before it. That is the
  # worse error of the two, so the narrower point is stated here rather than encoded.
  - rule_id: R3-CHAPTER-II-SCOPE
    clause_ref: Rule 3, with the marker phrase from Rule 2(bb) and Rule 2(bc) as substituted
    gazette_ref: LMPC-2011__amended-to-2021-10-31__maharashtra-compilation.pdf
    source_text: >-
      3. Applicability of the Chapter- The provisions of this chapter shall not apply to-
      (a) packages of commodities containing quantity of more than 25 kilogram or 25 litre;
      (b) cement, fertilizer and agricultural farm produce sold in bags above 50 kilogram;
      and (c) packaged commodities meant for industrial consumers or institutional consumers
    status: VERIFIED
    effective_from: 2011-04-01
    effective_to: null
    conditions:
      kind: chapter_ii_scope
      # Inclusive: Rule 3(a) excludes "more than" 25, so 25 exactly is still in scope.
      maximum_weight_inclusive_kg: 25
      maximum_volume_inclusive_l: 25
      bagged_commodities: [cement, fertilizer, agricultural_farm_produce]
      bagged_maximum_inclusive_kg: 50
      not_for_retail_sale_marker: not for retail sale
    evidence_requirement: declared_net_quantity_or_confirmed_institutional_or_industrial_supply
    severity: REVIEW
    # Rule 3 states no duty of its own — it decides whether the duties below arise. As
    # applicability metadata it governs no single declaration (null), and its disposition
    # is NOT_AN_OBLIGATION, so it emits no finding in its own name.
    governs_declarations: null

  - rule_id: R6-1-A
    clause_ref: Rule 6(1)(a)
    gazette_ref: LMPC-2011__amended-to-2021-10-31__maharashtra-compilation.pdf
    source_text: >-
      the name and address of the manufacturer, or where the manufacturer is not the packer,
      the name and address of the manufacturer and packer and for any imported package the
      name and address of the importer shall be mentioned on every package.
    status: VERIFIED
    effective_from: 2018-01-01
    effective_to: null
    conditions:
      kind: declaration_required
      declarations:
        - manufacturer_name_and_address
        - packer_name_and_address_when_manufacturer_is_not_packer
        - importer_name_and_address_for_imported_package
      exceptions:
        - In respect of packages containing food articles, the Food Safety and Standards Act, 2006 and the rules made thereunder apply.
    evidence_requirement: declaration_text_and_role_binding
    severity: POTENTIAL_VIOLATION
    governs_declarations: [NAME_AND_ADDRESS]

  - rule_id: R6-1-AA
    clause_ref: Rule 6(1)(aa)
    gazette_ref: GSR-629E__2017-06-23__amendment-rules-2017.pdf
    source_text: >-
      The name of the country of origin or manufacture or assembly in case of imported
      products shall be mentioned on the package;
    status: VERIFIED
    effective_from: 2018-01-01
    effective_to: null
    conditions:
      kind: declaration_required
      declarations: [country_of_origin_or_manufacture_or_assembly]
      exceptions: []
    evidence_requirement: declaration_text
    severity: POTENTIAL_VIOLATION
    governs_declarations: [COUNTRY_OF_ORIGIN]

  - rule_id: R6-1-B
    clause_ref: Rule 6(1)(b)
    gazette_ref: LMPC-2011__amended-to-2021-10-31__maharashtra-compilation.pdf
    source_text: >-
      The common or generic names of the commodity contained in the package and in case of
      packages with more than one product, the name and number or quantity of each product
      shall be mentioned on the package.
    status: VERIFIED
    effective_from: 2011-04-01
    effective_to: null
    conditions:
      kind: declaration_required
      declarations:
        - common_or_generic_name
        - each_product_name_and_number_or_quantity_for_packages_with_more_than_one_product
      exceptions: []
    evidence_requirement: declaration_text
    severity: POTENTIAL_VIOLATION
    governs_declarations: [COMMON_OR_GENERIC_NAME]

  - rule_id: R6-1-C
    clause_ref: Rule 6(1)(c)
    gazette_ref: LMPC-2011__amended-to-2021-10-31__maharashtra-compilation.pdf
    source_text: >-
      The net quantity, in terms of the standard unit of weight or measure, of the commodity
      contained in the package or where the commodity is packed or sold by number, the number
      of the commodity contained in the package shall be mentioned.
    status: VERIFIED
    effective_from: 2011-04-01
    effective_to: null
    conditions:
      kind: declaration_required
      declarations: [net_quantity_or_count]
      exceptions: []
    evidence_requirement: normalized_quantity_or_count_declaration
    severity: POTENTIAL_VIOLATION
    governs_declarations: [NET_QUANTITY]

  - rule_id: R6-1-D
    clause_ref: Rule 6(1)(d)
    gazette_ref: LMPC-2011__amended-to-2021-10-31__maharashtra-compilation.pdf
    source_text: >-
      The month and year in which the commodity is manufactured shall be mentioned in the
      package. Provided that for packages containing food articles, the provisions of the
      Prevention of Food Adulteration Act 1954 (37 of 1954) and the rules made there under
      shall apply; Provided further that nothing in this sub-clause shall apply in case of
      packages containing seeds which are labeled and certified under the provisions of the
      Seeds Act, 1966 (54 of 1966) and the rules made there under; Provided also that for
      packages containing cosmetics products, the provisions of the Drugs and Cosmetics
      Rules, 1945 shall apply.
    status: VERIFIED
    effective_from: 2022-04-01
    effective_to: null
    conditions:
      kind: declaration_required
      declarations: [month_and_year_of_manufacture]
      exceptions:
        - For packages containing food articles, the applicable food law provisions apply.
        - Packages containing seeds labelled and certified under the Seeds Act, 1966 and its rules.
        - For packages containing cosmetic products, the Drugs and Cosmetics Rules, 1945 apply.
    evidence_requirement: manufacture_date_declaration
    severity: POTENTIAL_VIOLATION
    governs_declarations: [MANUFACTURE_DATE]

  - rule_id: R6-1-D-GSR-722E
    clause_ref: Rule 6(1)(d) provisos effective 2024
    gazette_ref: GSR-722E__2023-10-06__amendment-rules-2023.pdf
    source_text: >-
      Provided also that nothing contained in this clause shall apply to spare parts and
      accessories used for the purpose of servicing with a warranty and not sold to end
      customers: Provided also that for electronic products, spare parts and accessories,
      the declaration of month and year of manufacture shall be specified anywhere on the
      retail package in a visible and clearly legible manner.
    status: VERIFIED
    effective_from: 2024-04-01
    effective_to: null
    conditions:
      kind: declaration_required
      declarations: [visible_and_clearly_legible_month_and_year_of_manufacture]
      exceptions:
        - Spare parts and accessories used for servicing with a warranty and not sold to end customers.
    evidence_requirement: visible_legible_manufacture_date_declaration
    severity: POTENTIAL_VIOLATION
    governs_declarations: [MANUFACTURE_DATE]

  - rule_id: R6-1-DA
    clause_ref: Rule 6(1)(da)
    gazette_ref: GSR-629E__2017-06-23__amendment-rules-2017.pdf
    source_text: >-
      If a package contains a commodity which may become unfit for human consumption after
      a period of time, the ‘best before or use by the date, month and year’ shall also be
      mentioned on the label: Provided that nothing in this clause shall apply if a provision
      in this regard is made in any other law.
    status: VERIFIED
    effective_from: 2018-01-01
    effective_to: null
    conditions:
      kind: declaration_required
      declarations: [best_before_or_use_by_date_month_and_year]
      exceptions:
        - A provision in this regard is made in another law.
    evidence_requirement: durability_date_declaration
    severity: POTENTIAL_VIOLATION
    governs_declarations: [BEST_BEFORE_DATE]

  - rule_id: R6-1-E
    clause_ref: Rule 6(1)(e)
    gazette_ref: LMPC-2011__amended-to-2021-10-31__maharashtra-compilation.pdf
    source_text: the retail sale price of the package;
    status: VERIFIED
    effective_from: 2011-04-01
    effective_to: null
    conditions:
      kind: declaration_required
      declarations: [retail_sale_price]
      exceptions:
        - A package containing Bidi.
        - A domestic liquefied petroleum gas cylinder whose price is covered under the Administrative Price Mechanism of the Government.
    evidence_requirement: retail_sale_price_declaration
    severity: POTENTIAL_VIOLATION
    governs_declarations: [RETAIL_SALE_PRICE]

  - rule_id: R6-1-F
    clause_ref: Rule 6(1)(f)
    gazette_ref: LMPC-2011__amended-to-2021-10-31__maharashtra-compilation.pdf
    source_text: >-
      Where the sizes of the commodity contained in the package are relevant, the dimensions
      of the commodity contained in the package and if the dimensions of the different pieces
      are different, the dimensions of each such different piece shall be mentioned.
    status: VERIFIED
    effective_from: 2011-04-01
    effective_to: null
    conditions:
      kind: declaration_required
      declarations: [relevant_dimensions]
      exceptions: []
    evidence_requirement: dimensions_declaration_when_relevant
    severity: POTENTIAL_VIOLATION
    governs_declarations: [DIMENSIONS]

  - rule_id: R6-1-G
    clause_ref: Rule 6(1)(g)
    gazette_ref: LMPC-2011__amended-to-2021-10-31__maharashtra-compilation.pdf
    source_text: "such other matter as are specified in these rules:"
    status: VERIFIED
    effective_from: 2011-04-01
    effective_to: null
    conditions:
      kind: declaration_required
      declarations: [other_matter_specified_in_these_rules]
      exceptions: []
    evidence_requirement: rule_specific_declaration_evidence
    severity: REVIEW
    governs_declarations: [OTHER_PRESCRIBED_MATTER]

  - rule_id: R7-2-TABLE-I
    clause_ref: Rule 7(2), Table-I
    gazette_ref: GSR-629E__2017-06-23__amendment-rules-2017.pdf
    source_text: >-
      The height of any numeral and letter in the declaration required under these rules shall
      be as per Table-I.
    status: VERIFIED
    effective_from: 2018-01-01
    effective_to: null
    conditions:
      kind: table_height
      bands:
        - minimum_area_exclusive_cm2: null
          maximum_area_inclusive_cm2: 50
          normal_minimum_height_mm: 1.0
          moulded_minimum_height_mm: 1.5
        - minimum_area_exclusive_cm2: 50
          maximum_area_inclusive_cm2: 100
          normal_minimum_height_mm: 1.5
          moulded_minimum_height_mm: 3.0
        - minimum_area_exclusive_cm2: 100
          maximum_area_inclusive_cm2: 500
          normal_minimum_height_mm: 2.5
          moulded_minimum_height_mm: 4.0
        - minimum_area_exclusive_cm2: 500
          maximum_area_inclusive_cm2: 2500
          normal_minimum_height_mm: 4.0
          moulded_minimum_height_mm: 6.0
        - minimum_area_exclusive_cm2: 2500
          maximum_area_inclusive_cm2: null
          normal_minimum_height_mm: 6.0
          moulded_minimum_height_mm: 6.0
    evidence_requirement: calibrated_or_artwork_character_height_and_pdp_area
    severity: POTENTIAL_VIOLATION
    # Rule 7(2) prescribes that 'The height of any numeral and letter in the declaration
    # required under these rules shall be as per Table-I.' The minimum font height mandate
    # applies universally across letters and numerals in all mandatory declarations.
    # Therefore, this clause genuinely governs all declarations (null).
    governs_declarations: null

  - rule_id: R7-3-WIDTH-RATIO
    clause_ref: Rule 7(3)
    gazette_ref: GSR-629E__2017-06-23__amendment-rules-2017.pdf
    source_text: >-
      The width of the letter or numeral shall not be less than one third of its height,
      except in the case of numeral “1” and letters (i), (I) and (l).
    status: VERIFIED
    effective_from: 2018-01-01
    effective_to: null
    conditions:
      kind: width_ratio
      minimum_width_to_height_ratio: 0.3333333333333333333333333333
      exempt_characters: ["1", i, I, l]
    evidence_requirement: calibrated_or_artwork_character_width_and_height
    severity: POTENTIAL_VIOLATION
    # Rule 7(3) mandates that 'The width of the letter or numeral shall not be less than
    # one third of its height', subject to specific character exemptions ('1', i, I, l).
    # Like Rule 7(2), this proportion requirement governs letters and numerals across all
    # mandatory declarations. Therefore, this clause genuinely governs all declarations (null).
    governs_declarations: null

  - rule_id: R7-4-PDP-AREA
    clause_ref: Rule 7(4)
    gazette_ref: GSR-629E__2017-06-23__amendment-rules-2017.pdf
    source_text: >-
      The area not including the top, bottom, flange at top and bottom of cans, and shoulders
      and neck of bottle and jars shall be determined in the following manner, namely:-
      (a) in the case of a rectangular package, where one entire side can properly be considered
      to be the principal display panel side, the product of the height multiplied by the width
      of that side; (b) in case of a cylindrical or nearly cylindrical package, 40 per cent. of
      the product of the height of the package multiplied by the circumference; (c) in case of
      any other shaped package , 40 per cent. of the total surface of the package, or an area
      considered to be a principal display panel of the package.
    status: VERIFIED
    effective_from: 2018-01-01
    effective_to: null
    conditions:
      kind: pdp_area
      cylindrical_multiplier: 0.40
      other_shape_multiplier: 0.40
      allow_legally_identified_pdp_area: true
      excluded_regions: [top, bottom, can_top_flange, can_bottom_flange, bottle_or_jar_shoulders, bottle_or_jar_neck]
    evidence_requirement: supplied_calibrated_dimensions_or_legally_identified_pdp_area
    severity: REVIEW
    # Rule 7(4) defines mathematical computation methods for principal display panel area
    # across various packaging geometries. As computation metadata rather than a declaration-
    # specific obligation, it governs no single declaration (null).
    governs_declarations: null

  - rule_id: R7-5-OTHER-LAW
    clause_ref: Rule 7(5)
    gazette_ref: GSR-629E__2017-06-23__amendment-rules-2017.pdf
    source_text: >-
      Except size of the numbers and letters for declaring net weight, retail sale price,
      date of expiry or best before or use by date (wherever and as applicable) and consumer
      care details, the provisions under sub-rules (1) to (4) shall not apply to a package if
      the information to be specified on such package under this rule is also required to be
      given by or under any other law for the time being in force.
    status: VERIFIED
    effective_from: 2018-01-01
    effective_to: null
    conditions:
      kind: other_law_carve_out
      preserved_declarations: [net_weight, retail_sale_price, expiry_best_before_use_by, consumer_care_details]
    evidence_requirement: declaration_type_and_other_law_applicability
    severity: REVIEW
    # Rule 7(5) is a statutory carve-out for declarations required under other laws,
    # preserving size rules for net weight, retail sale price, expiry/best before date,
    # and consumer care. As routing metadata, it governs no single declaration (null).
    governs_declarations: null

  # G.S.R. 778(E) is a CARVE-OUT, not a stricter path: it moves height, width and the
  # panel declaration to the Medical Devices Rules, 2017 and removes the Rule 33
  # relaxation. Nothing here raises a threshold — Rule 7 Table-I simply stops applying.
  #
  # The gazette states "rule 33 shall be numbered as sub-rule (1)" and inserts a new
  # sub-rule (2). The Maharashtra compilation already shows a 33(1) and a 33(2), so the
  # two texts disagree on the pre-amendment numbering. The compilation is semi-official
  # and the gazette is primary, so the gazette's numbering is what is encoded and cited.
  - rule_id: R7-MEDICAL-DEVICE-OVERRIDE
    clause_ref: Rule 2(h) proviso, Rule 7(2) proviso, Rule 7(3) proviso, Rule 33(2)
    gazette_ref: GSR-778E__2025-10-23__medical-devices-mdr-2017.pdf
    source_text: >-
      In rule 2, to clause (h), the following proviso shall be inserted, namely:- "Provided
      that for packages containing medical devices, the provisions of the Medical Devices
      Rules, 2017, shall apply to make declarations;". In rule 7, in sub-rule (2), the
      following proviso shall be inserted at the end, namely:- "Provided that for packages
      containing medical devices, the provisions of the Medical Devices Rules, 2017, shall
      apply for the height of any numeral and letter to make declarations."; to sub-rule (3),
      the following proviso shall be inserted at the end, namely:- "Provided that for packages
      containing medical devices, the provisions of the Medical Devices Rules, 2017, shall
      apply for the width of any numeral and letter to make declarations.". Rule 33 shall be
      numbered as sub-rule (1) and the following sub-rule shall be inserted, namely:- "(2) In
      case where the Medical Devices Rules, 2017 are applicable, the relaxation given under
      this rule shall not apply.".
    status: VERIFIED
    # In force on the date of publication in the official gazette, which is 24.10.2025.
    effective_from: 2025-10-24
    effective_to: null
    conditions:
      kind: sector_override
      sector: medical_device
      controlling_framework: Medical Devices Rules, 2017
      overrides: [table_height, width_ratio, pdp_declaration]
      disapplies_rule_33_relaxation: true
    evidence_requirement: medical_device_classification_and_mdr_specific_evidence
    severity: REVIEW
    # G.S.R. 778(E) routes numeral and letter dimensions for medical devices to the
    # Medical Devices Rules, 2017. As sector routing metadata, it governs no single
    # declaration (null).
    governs_declarations: null

  # Explanation III disapplies Rule 6(1)(a) for food articles outright and routes the
  # manufacturer declaration to the Food Safety and Standards Act, 2006.
  #
  # effective_from is INHERITED from R6-1-A, the clause this explanation sits inside. The
  # Maharashtra compilation states no separate commencement for the explanation, and
  # inheriting a date the store already commits to is preferable to inventing one.
  - rule_id: R6-1-A-EXPL-III-FOOD
    clause_ref: Rule 6(1)(a) Explanation III
    gazette_ref: LMPC-2011__amended-to-2021-10-31__maharashtra-compilation.pdf
    source_text: >-
      Explanation III. - In respect of packages containing food articles, the provisions of
      this clause shall not apply, but the provisions of, and the requirements specified in
      the Food Safety and Standards Act, 2006 (34 of 2006) and the rules made there under
      shall apply;
    status: VERIFIED
    effective_from: 2018-01-01
    effective_to: null
    conditions:
      kind: sector_override
      sector: food
      controlling_framework: Food Safety and Standards Act, 2006
      overrides: [manufacturer_declaration]
    evidence_requirement: food_article_classification_and_fssa_declaration_evidence
    severity: REVIEW
    governs_declarations: [NAME_AND_ADDRESS]

  # The third proviso to Rule 6(1)(d) routes the date declaration for cosmetics to the
  # Drugs and Cosmetics Rules, 1945.
  #
  # effective_from is INHERITED from R6-1-D, the clause this proviso sits inside. The
  # compilation states no separate commencement for the proviso.
  - rule_id: R6-1-D-COSMETICS
    clause_ref: Rule 6(1)(d) third proviso
    gazette_ref: LMPC-2011__amended-to-2021-10-31__maharashtra-compilation.pdf
    source_text: >-
      Provided also that for packages containing cosmetics products, the provisions of the
      Drugs and Cosmetics Rules, 1945 shall apply.
    status: VERIFIED
    effective_from: 2022-04-01
    effective_to: null
    conditions:
      kind: sector_override
      sector: cosmetics
      controlling_framework: Drugs and Cosmetics Rules, 1945
      overrides: [date_declaration]
    evidence_requirement: cosmetic_product_classification_and_dc_rules_date_evidence
    severity: REVIEW
    governs_declarations: [MANUFACTURE_DATE]

  # Rule 8 governs WHERE a declaration appears. Rule 9 below governs HOW it appears.
  # Two rules, two conditions, two evidence requirements — never one merged check.
  - rule_id: R8-1-PDP-PLACEMENT
    clause_ref: Rule 8(1)
    gazette_ref: LMPC-2011__amended-to-2021-10-31__maharashtra-compilation.pdf
    source_text: >-
      Every declaration required to be made under these rules shall appear on the principal
      display panel.
    status: VERIFIED
    effective_from: 2011-04-01
    effective_to: null
    conditions:
      kind: placement
      required_location: principal_display_panel
    evidence_requirement: declaration_location_on_detected_principal_display_panel
    severity: POTENTIAL_VIOLATION
    # Rule 8(1) mandates that 'Every declaration required to be made under these rules shall
    # appear on the principal display panel.' By statutory design, this placement obligation
    # is universal across all mandatory declarations. Therefore, it genuinely governs all
    # declarations (null).
    governs_declarations: null

  # The Rule 8(1) proviso is geometrically measurable, so its evidence requirement is a
  # calibrated MEASUREMENT, not a text span. The multiples are 1 and 2 because the
  # proviso states them; they are read from here and never written into the evaluator.
  - rule_id: R8-1-FREE-SPACE
    clause_ref: Rule 8(1) proviso
    gazette_ref: LMPC-2011__amended-to-2021-10-31__maharashtra-compilation.pdf
    source_text: >-
      Provided that the area surrounding the quantity declaration shall be free from printed
      information. (a) above and below by a space equal to at least the height of the numeral
      in the declaration, and (b) to the left and right by a space at least twice the height
      of numeral in the declaration.
    status: VERIFIED
    effective_from: 2011-04-01
    effective_to: null
    conditions:
      kind: free_space
      above_below_multiple_of_numeral_height: 1
      left_right_multiple_of_numeral_height: 2
    evidence_requirement: calibrated_free_space_measurement_around_quantity_declaration
    severity: POTENTIAL_VIOLATION
    governs_declarations: [NET_QUANTITY]

  - rule_id: R9-1-MANNER
    clause_ref: Rule 9(1)
    gazette_ref: LMPC-2011__amended-to-2021-10-31__maharashtra-compilation.pdf
    source_text: >-
      Every declaration which is required to be made on a package under these rules shall be
      - (a) legible and prominent; (b) numerals of the retail sale price and net quantity
      declaration shall be printed, painted or inscribed on the package in a colour that
      contrasts conspicuously with the background of the label; Provided that,- (a) where any
      label information is blown, formed or molded on a glass or plastic surface such
      information need not be required to be presented in a contrasting colour; (b) where any
      declaration on a package is printed either in the form of hand-writing or hand script,
      such declaration shall be clear, unambiguous and legible.
    status: VERIFIED
    effective_from: 2011-04-01
    effective_to: null
    conditions:
      kind: declaration_manner
      legible_and_prominent: true
      contrasting_colour_declarations: [retail_sale_price, net_quantity]
      contrast_exempt_surfaces: [blown_formed_or_moulded_glass, blown_formed_or_moulded_plastic]
      handwritten_must_be_clear_unambiguous_and_legible: true
    evidence_requirement: declaration_legibility_and_colour_contrast_observation
    severity: POTENTIAL_VIOLATION
    # Rule 9(1)(b) specifically mandates contrasting colour for retail sale price and net quantity
    # numerals, which forms the actionable constraint evaluated under conditions.contrasting_colour_declarations.
    governs_declarations: [RETAIL_SALE_PRICE, NET_QUANTITY]

  - rule_id: R9-3-OUTER-CONTAINER
    clause_ref: Rule 9(3)
    gazette_ref: LMPC-2011__amended-to-2021-10-31__maharashtra-compilation.pdf
    source_text: >-
      Where a package is provided with an outside container or wrapper such container or
      wrapper shall also contain all the declarations which are required to appear on the
      package except where such container or wrapper itself is transparent and the
      declarations on the package itself are easily readable through such outside wrapper.
      Provided that no such declarations on the inner package is required, if the outer
      package contains all declarations required under these rules.
    status: VERIFIED
    effective_from: 2011-04-01
    effective_to: null
    conditions:
      kind: outer_container
      outer_must_carry_all_declarations: true
      transparent_outer_exempt_when_inner_readable: true
      inner_declarations_not_required_when_outer_complete: true
    evidence_requirement: outer_wrapper_transparency_and_declaration_completeness
    severity: POTENTIAL_VIOLATION
    # Rule 9(3) explicitly governs 'all the declarations which are required to appear on the
    # package' when an outside container or wrapper is provided. By its express statutory
    # terms, this packaging wrapper requirement applies across every mandatory declaration
    # required under these rules. Therefore, it genuinely governs all declarations (null).
    governs_declarations: null

  # G.S.R. 722(E) inserted clauses (ka) and (kb) after rule 2 clause (k). In force on
  # 01.01.2024 per its own paragraph 1(2). A definition classifies a package; it does not
  # itself propose a violation, so severity is REVIEW.
  - rule_id: R2-KA-COMBINATION-PACKAGE
    clause_ref: Rule 2(ka)
    gazette_ref: GSR-722E__2023-10-06__amendment-rules-2023.pdf
    source_text: >-
      "combination package" means a package intended for retail sale, containing two or more
      individual packages, or individual pieces, of dissimilar commodities; Illustration: A
      package containing dissimilar commodities such as, spoons, knives, forks, cups, napkins,
      or the like is a combination package;
    status: VERIFIED
    effective_from: 2024-01-01
    effective_to: null
    conditions:
      kind: package_definition
      package_type: combination_package
      intended_for_retail_sale: true
      minimum_constituent_count: 2
      constituent_similarity: dissimilar
      # Rule 2(ka) says only "individual packages, or individual pieces" and
      # "intended for retail sale". Neither limb of Rule 2(kc) is stated here.
      constituents_individually_packaged_or_labelled: false
      retail_sale_of_individual_pieces_permitted: false
      illustrations:
        - A package containing dissimilar commodities such as spoons, knives, forks, cups, napkins, or the like.
    evidence_requirement: constituent_package_or_piece_inventory_and_commodity_dissimilarity
    severity: REVIEW
    # Package definition rule defining package composition rather than declarations; unpopulated (None).
    governs_declarations: null

  - rule_id: R2-KB-GROUP-PACKAGE
    clause_ref: Rule 2(kb)
    gazette_ref: GSR-722E__2023-10-06__amendment-rules-2023.pdf
    source_text: >-
      "group package" means a package intended for retail sale, containing two or more
      individual packages, or individual pieces, of similar, but not identical (whether in
      quantity or size) commodities. Explanation: Commodities which are generally the same but
      differ in weight, measure or volume, appearance or quality are similar, but not identical
      commodities.
    status: VERIFIED
    effective_from: 2024-01-01
    effective_to: null
    conditions:
      kind: package_definition
      package_type: group_package
      intended_for_retail_sale: true
      minimum_constituent_count: 2
      constituent_similarity: similar_but_not_identical
      # As with 2(ka), Rule 2(kb) states neither limb.
      constituents_individually_packaged_or_labelled: false
      retail_sale_of_individual_pieces_permitted: false
      illustrations:
        - A package containing two sponges 100 mm x 75 mm x 20 mm, one sponge 100 mm x 100 mm x 30 mm and four sponges 100 mm x 50 mm x 15 mm.
        - A package containing assorted biscuits.
        - A package containing similar commodities of different brands.
    evidence_requirement: constituent_package_or_piece_inventory_and_commodity_similarity
    severity: REVIEW
    # Package definition rule defining package composition rather than declarations; unpopulated (None).
    governs_declarations: null

  # Rule 2(kc), inserted by G.S.R. 722(E) in the same instrument as (ka) and (kb).
  # A multi-piece package is NOT a group package: its pieces are individually packaged
  # or labelled, carry the same commodity in identical quantity, and may be sold on
  # their own as well as together. Those two flags are the practical difference — a
  # separately labelled, separately saleable piece has to stand as a retail package in
  # its own right.
  #
  # G.S.R. 722(E) states no multi-piece-specific declaration obligation, and no
  # amendment to Rule 9(3), so no outer-wrapper versus inner-piece rule is encoded here.
  # The one multi-piece obligation the instrument does state is the Rule 6(11) unit sale
  # price exemption in its paragraph 4, which is out of scope: Rule 6(11) is a format
  # rule with no tolerance and no rounding increment and is deliberately not in this
  # store.
  - rule_id: R2-KC-MULTI-PIECE-PACKAGE
    clause_ref: Rule 2(kc)
    gazette_ref: GSR-722E__2023-10-06__amendment-rules-2023.pdf
    source_text: >-
      "multi-piece package" means a package containing two or more individual packaged or
      labelled pieces of the same commodities of identical quantity, intended for retail sale,
      either in individual pieces or the package as a whole. Illustration: (i) A package
      containing "5 toilet soap cakes of net weight 20g each and total net weight of 100 g" is
      a multi-piece package;
    status: VERIFIED
    effective_from: 2024-01-01
    effective_to: null
    conditions:
      kind: package_definition
      package_type: multi_piece_package
      intended_for_retail_sale: true
      minimum_constituent_count: 2
      constituent_similarity: identical
      constituents_individually_packaged_or_labelled: true
      retail_sale_of_individual_pieces_permitted: true
      illustrations:
        - A package containing 5 toilet soap cakes of net weight 20 g each and total net weight of 100 g.
    evidence_requirement: constituent_piece_inventory_and_per_piece_labelling_and_quantity_identity
    severity: REVIEW
    # Package definition rule defining package composition rather than declarations; unpopulated (None).
    governs_declarations: null

  # The proviso to Rule 2(kc) is its own obligation with its own gazette text, so it is
  # its own rule rather than a field on the definition above.
  #
  # package_type scopes it. The proviso routes food articles to the FSSA 2006 *for
  # multi-piece packages*; an unscoped food override would fire on every food package and
  # claim a routing the gazette does not support. R6-1-A-EXPL-III-FOOD stays unscoped and
  # keeps firing for every food package exactly as before.
  - rule_id: R2-KC-MULTI-PIECE-FOOD
    clause_ref: Rule 2(kc) proviso
    gazette_ref: GSR-722E__2023-10-06__amendment-rules-2023.pdf
    source_text: >-
      Provided that for packages containing food articles, the provisions of the Food Safety
      and Standards Act, 2006 (34 of 2006) and the rules made thereunder shall apply.
    status: VERIFIED
    effective_from: 2024-01-01
    effective_to: null
    conditions:
      kind: sector_override
      sector: food
      controlling_framework: Food Safety and Standards Act, 2006
      package_type: multi_piece_package
      overrides: [package_definition]
    evidence_requirement: food_article_classification_and_multi_piece_package_composition
    severity: REVIEW
    # Sector carve-out for multi-piece food packages; unpopulated (None).
    governs_declarations: null

