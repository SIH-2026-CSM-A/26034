[project]
name = "lmpc-backend"
version = "0.1.0"
description = "Legal Metrology (Packaged Commodities) Rules 2011 compliance system — backend"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "opencv-python-headless>=5.0.0.93",
    "pytesseract>=0.3.13",
    "ultralytics>=8.4.141",
    # Declared, though nothing here imports it: ultralytics pulls torch transitively, and
    # uv applies [tool.uv.sources] only to a project's DIRECT dependencies. Left implicit,
    # the CPU index below is silently ignored and PyPI's CUDA build wins. Pinning the
    # source is the only reason these two lines exist.
    "torch>=2.0",
    "torchvision>=0.15",
    "paddleocr>=2.10.0",
    "paddlepaddle>=3.3.1",
    "boto3>=1.43.89",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "python-multipart>=0.0.20",
    "reportlab>=5.0.1",
    "python-docx>=1.2.0",
    "pypdf>=6.17.0",
    "pdfplumber>=0.11",
    "defusedxml>=0.7.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "import-linter>=2.1",
    # The ASGI transport behind fastapi.testclient. Present transitively via ultralytics
    # today; declared here because an ultralytics bump could drop it and take every HTTP
    # test with it. Dev group only — it must never reach the runtime dependency list.
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# torch reaches this project only through ultralytics, and only ever runs on CPU: the
# image has no NVIDIA runtime and the VM has no GPU. PyPI's default torch wheel for
# linux-x86_64 declares the CUDA runtime as hard dependencies, which pulled 2.4 GB of
# nvidia-* and triton wheels into a CPU-only image — more than four times everything
# else in the tree combined.
#
# `explicit = true` matters: without it uv may resolve *any* package from this index.
# With it, only the packages named in [tool.uv.sources] come from here.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Tests needing a real database. Skipped when DATABASE_URL is unset or unreachable, so a
# laptop with nothing running still gets a clean run. CI provides Postgres, which is what
# stops this set from being a permanently-skipped green tick.
markers = ["postgres: needs a live PostgreSQL at DATABASE_URL"]

# Architecture boundaries. All three contracts are enforced by `lint-imports` in CI.
#
# Together they mean: a module imports from app.contracts, app.core, and itself —
# nothing else. app.pipeline composes modules. app.contracts imports nothing.
# app.main sits above pipeline and nothing imports it: it is the entrypoint, and a
# module reaching back up to it would make the composition circular.
[tool.importlinter]
include_external_packages = true
root_package = "app"

[[tool.importlinter.contracts]]
name = "Layers: main > pipeline > modules > core > contracts"
type = "layers"
layers = [
    "app.main",
    "app.pipeline",
    "app.modules",
    "app.core",
    "app.contracts",
]

[[tool.importlinter.contracts]]
name = "Modules are independent of one another"
type = "independence"
modules = [
    "app.modules.analytics",
    "app.modules.reviews",
    "app.modules.vision",
    "app.modules.vendor",
    "app.modules.extraction",
    "app.modules.measurement",
    "app.modules.rules",
    "app.modules.tamper",
    "app.modules.evidence",
    "app.modules.complaints",
]

[[tool.importlinter.contracts]]
name = "No bck.* import path - app is the only package root"
type = "forbidden"
source_modules = ["app"]
forbidden_modules = ["bck"]
