[project]
name = "lmpc-backend"
version = "0.1.0"
description = "Legal Metrology (Packaged Commodities) Rules 2011 compliance system — backend"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# Architecture boundaries. Both contracts are enforced by `lint-imports` in CI.
#
# Together they mean: a module imports from app.contracts, app.core, and itself —
# nothing else. app.pipeline composes modules. app.contracts imports nothing.
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Layers: pipeline > modules > core > contracts"
type = "layers"
layers = [
    "app.pipeline",
    "app.modules",
    "app.core",
    "app.contracts",
]

[[tool.importlinter.contracts]]
name = "Modules are independent of one another"
type = "independence"
modules = [
    "app.modules.vision",
    "app.modules.extraction",
    "app.modules.measurement",
    "app.modules.rules",
    "app.modules.tamper",
    "app.modules.evidence",
]

[[tool.importlinter.contracts]]
name = "No bck.* import path - app is the only package root"
type = "forbidden"
source_modules = ["app"]
forbidden_modules = ["bck"]
