name: Frontend

on:
  pull_request:
    paths:
      - 'fnt/**'
      - '.github/workflows/frontend.yml'

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fnt
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22.23.1
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: fnt/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Build
        run: npx vite build
