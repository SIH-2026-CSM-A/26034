server {
  listen 80;
  root /usr/share/nginx/html;

  # The API is served from this origin, so the browser never makes a cross-origin
  # request and CORS never enters into it. The frontend bundle is built with
  # VITE_API_BASE_URL=/api, so every call lands here and is proxied to the backend
  # over the compose network.
  #
  # The trailing slash on proxy_pass is load-bearing: it strips the /api prefix, so
  # /api/scans reaches the backend as /scans. The backend mounts its routers at
  # /auth and /scans with no prefix of its own, and must not gain one — moving the
  # prefix into the backend is what this block exists to avoid.
  location /api/ {
    proxy_pass http://backend:8000/;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A scan is a photograph. nginx defaults to 1m, which is under a phone camera's
    # output, and the rejection is a 413 from nginx that never reaches the backend —
    # so the upload appears to fail for no reason the application can report. The
    # backend sets no limit of its own, so this is the only one in the path.
    client_max_body_size 25m;

    # PaddleOCR and tesseract run on CPU here. nginx defaults to 60s, which a cold
    # first scan exceeds, and the browser then sees a 504 while the backend is still
    # working. Raised for the whole request cycle, not just the read.
    proxy_connect_timeout 30s;
    proxy_send_timeout   300s;
    proxy_read_timeout   300s;
  }

  # SPA fallback: react-router owns the paths, so anything that is not a real file is
  # index.html. Without this a refresh on /scans/123 is a 404 from nginx.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
