<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F3F4F1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0E13" media="(prefers-color-scheme: dark)" />
    <!-- Apply a stored appearance before first paint, so a dark-mode reload never flashes light. -->
    <script>
      try {
        var t = localStorage.getItem('pccs-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <link rel="preload" href="/fonts/BricolageGrotesque-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The two faces the first paint needs: body prose and the ledger figures. -->
    <link rel="preload" href="/fonts/IBMPlexSans-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/IBMPlexMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <title>ClauseCam — packaged commodity compliance for Legal Metrology</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
